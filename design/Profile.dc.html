<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
    body { margin: 0; background: #09090B; }
    a { color: #CCFF33; text-decoration: none; }
    a:hover { color: #DDFF6B; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #09090B; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; color: #F4F4F2; position: relative; overflow: hidden;">

  <div style="height: 52px;"></div>

  <div style="padding: 0 20px;">
    <div style="height: 34px; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.03em;">Profile</span>
      <div style="height: 34px; padding: 0 10px; margin-right: -10px; border-radius: 8px; display: flex; align-items: center;">
        <span style="font-size: 13px; font-weight: 600; color: #A0A0A8;">Edit</span>
      </div>
    </div>

    <!-- identity -->
    <div style="margin-top: 16px; display: flex; align-items: center; gap: 14px;">
      <div style="width: 58px; height: 58px; border-radius: 999px; background: #1C1C21; border: 1px solid #2A2A32; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 19px; font-weight: 600; color: #CCFF33;">HR</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em;">Hersh Rudrawal</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; color: #8E8E97;">TRAINING SINCE JUL 2026 · 34 SESSIONS</span>
      </div>
    </div>

    <!-- body stats -->
    <div style="margin-top: 18px; display: flex; gap: 8px;">
      <div style="flex: 1; height: 72px; border-radius: 13px; background: #131316; border: 1px solid #232328; padding: 11px 12px; display: flex; flex-direction: column; justify-content: space-between;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.13em; color: #8E8E97;">AGE</span>
        <div style="display: flex; align-items: baseline; gap: 3px;">
          <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 23px; font-weight: 600; letter-spacing: -0.02em;">21</span>
          <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 600; color: #7E7E88;">yrs</span>
        </div>
      </div>
      <div style="flex: 1; height: 72px; border-radius: 13px; background: #131316; border: 1px solid #232328; padding: 11px 12px; display: flex; flex-direction: column; justify-content: space-between;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.13em; color: #8E8E97;">WEIGHT</span>
        <div style="display: flex; align-items: baseline; gap: 3px;">
          <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 23px; font-weight: 600; letter-spacing: -0.02em;">162</span>
          <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 600; color: #7E7E88;">lb</span>
        </div>
      </div>
      <div style="flex: 1; height: 72px; border-radius: 13px; background: #131316; border: 1px solid #232328; padding: 11px 12px; display: flex; flex-direction: column; justify-content: space-between;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.13em; color: #8E8E97;">HEIGHT</span>
        <div style="display: flex; align-items: baseline; gap: 3px;">
          <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 23px; font-weight: 600; letter-spacing: -0.02em;">5'10</span>
        </div>
      </div>
    </div>

    <div style="margin-top: 22px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: #8E8E97;">BODY</div>
  </div>

  <!-- body rows -->
  <div style="margin-top: 10px;">
    <div style="height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 13px; border-bottom: 1px solid #18181C;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M6.5 8.5h11l1.8 12H4.7z"/><circle cx="12" cy="5" r="2.5"/></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 500;">Weight history</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; color: #CCFF33;">+4 lb</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#62626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div style="height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 13px; border-bottom: 1px solid #18181C;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3.5 14.5 14.5 3.5l6 6-11 11z"/><path d="M7 11l2 2M10 8l2 2M13 5l2 2"/></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 500;">Height history</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#62626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div style="height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 13px; border-bottom: 1px solid #18181C;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="2.5" y="8.5" width="19" height="7" rx="2"/><path d="M7 8.5v3M11 8.5v3M15 8.5v3M19 8.5v3"/></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 500;">Body measurements</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; color: #7E7E88;">6 tracked</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#62626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7"/></svg>
    </div>
  </div>

  <div style="margin-top: 20px; padding: 0 20px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: #8E8E97;">PREFERENCES</div>

  <div style="margin-top: 10px;">
    <div style="height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 13px; border-bottom: 1px solid #18181C;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 500;">Units</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; color: #A0A0A8;">lb · in · mi</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#62626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div style="height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 13px; border-bottom: 1px solid #18181C;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V10"/><path d="M9.5 2.5h5"/></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 500;">Default rest timer</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; color: #A0A0A8;">90s</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#62626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div style="height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 13px; border-bottom: 1px solid #18181C;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 500;">Appearance</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; color: #A0A0A8;">Dark</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#62626C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div style="height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 13px; border-bottom: 1px solid #18181C;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 3.5a6 6 0 0 0-6 6c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5a6 6 0 0 0-6-6z"/><path d="M10 19.5a2 2 0 0 0 4 0"/></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 500;">Rest reminders</span>
      <div style="width: 42px; height: 26px; border-radius: 999px; background: #CCFF33; padding: 3px; display: flex; justify-content: flex-end; flex-shrink: 0;">
        <div style="width: 20px; height: 20px; border-radius: 999px; background: #0B0F00;"></div>
      </div>
    </div>
  </div>

  <!-- tab bar -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: #0C0C0F; border-top: 1px solid #232328; display: flex; align-items: flex-start; padding-top: 11px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.1em; color: #8E8E97;">TODAY</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.1em; color: #8E8E97;">SEARCH</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6.5 20v-6"/><path d="M12 20V6"/><path d="M17.5 20v-9"/></svg>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.1em; color: #8E8E97;">PROGRESS</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.5-6 4.5z"/></svg>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.1em; color: #8E8E97;">SAVED</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#CCFF33" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.75"/><path d="M4.5 20.5c0-4.1 3.4-6.5 7.5-6.5s7.5 2.4 7.5 6.5"/></svg>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.1em; color: #CCFF33;">PROFILE</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
