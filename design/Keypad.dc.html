<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
    body { margin: 0; background: #09090B; }
    a { color: #CCFF33; text-decoration: none; }
    a:hover { color: #DDFF6B; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #09090B; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; color: #F4F4F2; position: relative; overflow: hidden;">

  <!-- the workout screen behind, dimmed -->
  <div style="position: absolute; inset: 0; opacity: 0.5;">
    <div style="height: 52px;"></div>
    <div style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#A0A0A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <div style="flex-grow: 1; text-align: center; font-size: 16px; font-weight: 700; letter-spacing: -0.015em;">Push Day</div>
      <div style="width: 21px;"></div>
    </div>
    <div style="padding: 22px 20px 0;">
      <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em;">Barbell Bench Press</div>
      <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 5px;">
        <div style="height: 52px; display: flex; align-items: center; justify-content: space-between;">
          <div style="width: 24px; height: 24px; border-radius: 999px; background: #CCFF33;"></div>
          <div style="width: 96px; height: 48px; border-radius: 11px; background: rgba(204,255,51,0.09); border: 1px solid rgba(204,255,51,0.26);"></div>
          <div style="width: 13px;"></div>
          <div style="width: 106px; height: 48px; border-radius: 11px; background: rgba(204,255,51,0.09); border: 1px solid rgba(204,255,51,0.26);"></div>
          <div style="width: 44px; height: 44px; border-radius: 12px; background: #CCFF33;"></div>
        </div>
        <div style="height: 52px; display: flex; align-items: center; justify-content: space-between;">
          <div style="width: 24px; height: 24px; border-radius: 999px; background: #CCFF33;"></div>
          <div style="width: 96px; height: 48px; border-radius: 11px; background: rgba(204,255,51,0.09); border: 1px solid rgba(204,255,51,0.26);"></div>
          <div style="width: 13px;"></div>
          <div style="width: 106px; height: 48px; border-radius: 11px; background: rgba(204,255,51,0.09); border: 1px solid rgba(204,255,51,0.26);"></div>
          <div style="width: 44px; height: 44px; border-radius: 12px; background: #CCFF33;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- scrim -->
  <div style="position: absolute; inset: 0; background: rgba(5,5,7,0.72);"></div>

  <!-- entry sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 290px; background: #131316; border-top: 1px solid #2A2A32; border-radius: 22px 22px 0 0; padding: 0 20px;">

    <div style="height: 20px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 38px; height: 4px; border-radius: 999px; background: #2E2E36;"></div>
    </div>

    <div style="height: 36px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.16em; color: #8E8E97;">SET 3 OF 3</span>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.015em;">Barbell Bench Press</span>
      </div>
      <div style="width: 30px; height: 30px; border-radius: 999px; background: #1C1C21; display: flex; align-items: center; justify-content: center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A0A0A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
    </div>

    <!-- the two values -->
    <div style="margin-top: 18px; display: flex; gap: 10px;">
      <div style="flex: 1; height: 92px; border-radius: 14px; background: #1C1C21; border: 1.5px solid #CCFF33; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.16em; color: #CCFF33;">REPS</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 38px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; color: #F4F4F2; font-variant-numeric: tabular-nums;">10</span>
      </div>
      <div style="flex: 1; height: 92px; border-radius: 14px; background: #16161A; border: 1px solid #26262C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.16em; color: #8E8E97;">WEIGHT · LB</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 38px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; color: #A0A0A8; font-variant-numeric: tabular-nums;">20</span>
      </div>
    </div>

    <!-- quick adjust -->
    <div style="margin-top: 12px; display: flex; gap: 8px;">
      <div style="flex: 1; height: 38px; border-radius: 999px; background: #1C1C21; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; color: #A0A0A8;">−2</span>
      </div>
      <div style="flex: 1; height: 38px; border-radius: 999px; background: #1C1C21; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; color: #A0A0A8;">−1</span>
      </div>
      <div style="flex: 1; height: 38px; border-radius: 999px; background: #1C1C21; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; color: #A0A0A8;">+1</span>
      </div>
      <div style="flex: 1; height: 38px; border-radius: 999px; background: #1C1C21; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; color: #A0A0A8;">+2</span>
      </div>
      <div style="flex: 1.4; height: 38px; border-radius: 999px; background: #1C1C21; display: flex; align-items: center; justify-content: center; gap: 5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A0A0A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13"/><path d="M12 7l5 5-5 5"/><path d="M21 5v14"/></svg>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; color: #A0A0A8;">LAST</span>
      </div>
    </div>

    <!-- keypad -->
    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 50px; border-radius: 12px; background: #1C1C21; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #F4F4F2;">1</span></div>
      <div style="height: 50px; border-radius: 12px; background: #1C1C21; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #F4F4F2;">2</span></div>
      <div style="height: 50px; border-radius: 12px; background: #1C1C21; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #F4F4F2;">3</span></div>
      <div style="height: 50px; border-radius: 12px; background: #1C1C21; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #F4F4F2;">4</span></div>
      <div style="height: 50px; border-radius: 12px; background: #1C1C21; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #F4F4F2;">5</span></div>
      <div style="height: 50px; border-radius: 12px; background: #1C1C21; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #F4F4F2;">6</span></div>
      <div style="height: 50px; border-radius: 12px; background: #1C1C21; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #F4F4F2;">7</span></div>
      <div style="height: 50px; border-radius: 12px; background: #1C1C21; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #F4F4F2;">8</span></div>
      <div style="height: 50px; border-radius: 12px; background: #1C1C21; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #F4F4F2;">9</span></div>
      <div style="height: 50px; border-radius: 12px; background: #16161A; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #A0A0A8;">.</span></div>
      <div style="height: 50px; border-radius: 12px; background: #1C1C21; display: flex; align-items: center; justify-content: center;"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 21px; font-weight: 500; color: #F4F4F2;">0</span></div>
      <div style="height: 50px; border-radius: 12px; background: #16161A; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#A0A0A8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5.5H9.5L3 12l6.5 6.5H21z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg>
      </div>
    </div>

    <!-- commit -->
    <div style="margin-top: 14px; height: 56px; border-radius: 14px; background: #CCFF33; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0B0F00" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>
      <span style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: #0B0F00;">Log set · start rest</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
